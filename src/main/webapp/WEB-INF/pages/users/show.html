<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Пользователь</title>
</head>
<body>
<p th:text="${user.id}">id</p>
<p th:text="${user.firstName}">first name</p>
<p th:text="${user.lastName}">last name</p>
<p th:text="${user.email}">email</p>
<a th:href="@{/users/edit?id={id}(id=${user.getId()})}">Edit</a>
<form th:method="POST" th:action="@{/users/delete?id={id}(id=${user.getId()})}">
    <input type="submit" value="Delete user"/>
</form>
</body>
</html>
