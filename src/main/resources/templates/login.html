<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        html, body {
            height: 100%;
            margin: 0;
            padding: 0;
        }

        body {
            display: flex;
            align-items: flex-start;
            justify-content: center;
            background-color: #f5f5f5;
            padding-top: 100px;
        }

        .form-signin {
            width: 100%;
            max-width: 330px;
            padding: 0;
            background-color: transparent;
            margin: 0;
        }

        /* === ЗАГОЛОВОК с ЖИРНЫМ ШРИФТОМ === */
        .signin-title {
            margin-bottom: 1.5rem;
            font-weight: 700 !important; /* Жирный шрифт (Bold) */
            color: #333;
            text-align: left;
            padding-left: 0;
            font-size: 1.5rem; /* Немного больше размер */
        }

        /* === ФОРМА === */
        .form-signin form {
            text-align: left;
        }

        /* === ПОЛЯ ВВОДА ВПЛОТНУЮ ДРУГ К ДРУГУ === */
        .form-floating {
            margin-bottom: 0 !important; /* Убираем отступы между полями */
        }

        /* Белый фон полей ввода */
        .form-control {
            background-color: white !important;
            border: 1px solid #ced4da;
        }

        /* === ПОДСВЕТКА ГОЛУБЫМ ПРИ НАВЕДЕНИИ === */
        .form-control:hover {
            border-color: #0d6efd !important; /* Голубая рамка при наведении */
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25) !important; /* Свечение */
        }

        .form-control:focus {
            border-color: #0d6efd !important;
            box-shadow: 0 0 0 0.2rem rgba(13, 110, 253, 0.25) !important;
        }

        /* Убираем стандартные скругления для полей */
        .form-control {
            border-radius: 0.375rem; /* Стандартное скругление Bootstrap */
        }

        /* Первое поле - нормальные скругления сверху */
        .form-floating:first-child .form-control {
            border-bottom-left-radius: 0;
            border-bottom-right-radius: 0;
            margin-bottom: -1px; /* Убираем двойную границу между полями */
        }

        /* Последнее поле - нормальные скругления снизу */
        .form-floating:last-child .form-control {
            border-top-left-radius: 0;
            border-top-right-radius: 0;
        }

        /* Если есть только одно поле */
        .form-floating:only-child .form-control {
            border-radius: 0.375rem;
        }

        /* === КНОПКА === */
        .btn-signin {
            background-color: #0d6efd;
            color: white;
            font-weight: 600;
            border: none;
            padding: 10px;
            font-size: 1.1rem;
            width: 100%;
            margin-top: 15px; /* Отступ от полей ввода */
            border-radius: 0.375rem; /* Такое же скругление как у полей */
        }

        .btn-signin:hover {
            background-color: #0b5ed7;
            color: white;
        }

        /* === СООБЩЕНИЯ === */
        .alert {
            margin-bottom: 1rem;
            text-align: left;
            border-radius: 0.375rem;
        }

        /* === CHECKBOX === */
        .form-check {
            text-align: left;
            margin-bottom: 1rem;
            margin-top: 10px;
        }
    </style>
</head>
<body>
<main class="form-signin">
    <!-- Заголовок с ЖИРНЫМ шрифтом -->
    <h1 class="h3 mb-3 fw-normal signin-title">Please sign in</h1>

    <form th:action="@{/perform_login}" method="post">
        <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

        <!-- Сообщения об ошибках -->
        <div th:if="${param.error}" class="alert alert-danger" role="alert">
            Invalid email address or password.
        </div>
        <div th:if="${param.logout}" class="alert alert-success" role="alert">
            You have been logged out successfully.
        </div>

        <!-- Поле для Email Address -->
        <div class="form-floating">
            <input type="text" class="form-control" id="username" name="username" placeholder="Email Address" required autofocus>
            <label for="username">Email Address</label>
        </div>

        <!-- Поле для Password -->
        <div class="form-floating">
            <input type="password" class="form-control" id="password" name="password" placeholder="Password" required>
            <label for="password">Password</label>
        </div>

        <!-- Кнопка Sign In -->
        <button class="btn btn-signin" type="submit">Sign in</button>
    </form>
</main>
</body>
</html>
