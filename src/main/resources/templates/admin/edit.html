<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Изменение пользователя</title>
</head>
<body>
<form th:method="POST" th:action="@{/admin/edit?id={id}(id=${user.getId()})}" th:object="${user}">
    <input type="hidden" th:name="${_csrf.parameterName}"
           th:value="${_csrf.token}">
    <label for="firstName">Enter first name</label>
    <input type="text" th:field="*{firstName}" id="firstName"/>
    <br>
    <label for="lastName">Enter last name</label>
    <input type="text" th:field="*{lastName}" id="lastName"/>
    <br>
    <label for="email">Enter email</label>
    <input type="text" th:field="*{username}" id="email"/>
    <br>
    <label for="age">Enter age</label>
    <input type="text" th:field="*{age}" id="age"/>
    <br>
    <label for="password">Enter password</label>
    <input type="text" th:field="*{password}" id="password"/>
    <br>
    <div th:each="role : ${allRoles}">
        <input type="checkbox"
               th:value="${role.id}"
               th:id="${'role_' + role.id}"
               name="roleIds"
               th:checked="${#sets.contains(user.roles, role)}">
        <label th:for="${'role_' + role.id}"
               th:text="${role.name}"></label>
    </div>
    <input type="submit" value="Update">
</form>
</body>
</html>
