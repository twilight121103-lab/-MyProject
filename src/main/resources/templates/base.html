<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Spring Security Admin</title>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.8.1/font/bootstrap-icons.css">

    <style>
        body { background-color: #f8f9fa; padding-top: 20px; }
        .navbar { box-shadow: 0 2px 4px rgba(0,0,0,.1); }
        .card { border-radius: 8px; box-shadow: 0 1px 3px rgba(0,0,0,.1); margin-bottom: 20px; }
        .table th { background-color: #f1f5f9; border-top: none; }
        .btn-group-sm .btn { padding: 0.25rem 0.5rem; }
    </style>
</head>
<body>
<!-- Навигационная панель -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <!-- ... навигация ... -->
    </div>
</nav>

<!-- Основной контейнер -->
<div class="container">
    <!-- Сообщения -->
    <div th:if="${param.success}" class="alert alert-success alert-dismissible fade show mb-4">
        <!-- ... -->
    </div>

    <div th:if="${param.error}" class="alert alert-danger alert-dismissible fade show mb-4">
        <!-- ... -->
    </div>

    <!-- Контент страниц -->
    <div th:fragment="content">

    </div>
</div>

<!-- Bootstrap JS Bundle -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>

<script>
    // Автоматическое закрытие алертов
    setTimeout(() => {
        document.querySelectorAll('.alert').forEach(alert => {
            new bootstrap.Alert(alert).close();
        });
    }, 5000);

    // Безопасная функция подтверждения удаления
    function confirmDelete(formId, userName) {
        if (confirm('Вы уверены, что хотите удалить пользователя "' + userName + '"?')) {
            document.getElementById(formId).submit();
        }
    }
</script>
</body>
</html>
